version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-compatible:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # Leave major updates ungrouped so React, Router, TypeScript and
    # Backstage migrations can be reviewed and validated separately.
