name: CI

# Lint, type-check, test, and build the plugin on every push to main and
# every pull request. No untrusted event inputs are used in any run:
# step — only static commands.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: lint + tsc + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # .npmrc pins legacy-peer-deps (required by Backstage's MUI v4
      # transitive dependency); npm ci honours it.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (emits dist-types)
        run: npm run tsc

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
